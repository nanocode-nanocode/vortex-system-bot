# VØRTΞX System Bot — Koyeb deployment config
# 1. Go to https://app.koyeb.com/
# 2. Connect GitHub → Select this repo
# 3. Paste this yaml or configure manually:
---
name: vortex-system-bot
type: worker
service:
  port: -1  # Discord bot, no HTTP port needed
  env:
    - key: DISCORD_TOKEN
      value: ""  # ← اكتب توكن البوت هنا
  routes: []
  regions:
    - fra
  scaling:
    min: 1
    max: 1
  docker:
    dockerfile: Dockerfile
