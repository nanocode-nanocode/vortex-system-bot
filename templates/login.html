{% extends "base.html" %}
{% block title %}تسجيل الدخول — VØRTΞX{% endblock %}
{% block content %}
<div class="login-page">
<div class="login-box">
  <h1>⬡ VØRTΞX</h1>
  <p>لوحة تحكم البوت — Dashboard</p>

  {% if oauth_enabled %}
  <a href="{{ oauth_url }}" class="btn btn-discord">
    🔗 تسجيل الدخول بـ Discord
  </a>
  <div class="or-divider">أو</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="password" name="password" placeholder="كلمة المرور" style="margin-bottom:10px" required>
    <button type="submit" class="btn">🔐 دخول</button>
  </form>

  {% if error %}
  <p style="color:var(--red);margin-top:12px;font-size:13px">❌ {{ error }}</p>
  {% endif %}
</div>
</div>
{% endblock %}
