name: 🚀 VØRTΞX Bot Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  check:
    name: 🔍 Syntax & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Install deps
        run: pip install pyflakes pygount
      - name: 🔬 PyFlakes
        run: |
          pyflakes bot.py db.py i18n.py dashboard.py
          pyflakes cogs/*.py
      - name: 📊 LOC
        run: |
          pygount --format=summary .
          echo "---"
          echo "Files: $(find . -name '*.py' -not -path './.git/*' | wc -l)"
          echo "Lines: $(wc -l < <(cat bot.py db.py i18n.py dashboard.py cogs/*.py 2>/dev/null))"

  docker:
    name: 🐳 Docker
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
