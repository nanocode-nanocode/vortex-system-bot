name: 🚀 VØRTΞX Bot Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: vortex-system-bot
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ── 1. Check & Test ──────────────────────────────────────
  check:
    name: 🔍 Syntax & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install deps (no runtime)
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes pygount

      - name: 🔬 PyFlakes check
        run: |
          pyflakes bot.py db.py i18n.py dashboard.py
          pyflakes cogs/*.py

      - name: 📊 Lines of Code
        run: |
          pygount --format=summary .
          echo "---"
          echo "Files: $(find . -name '*.py' -not -path './.git/*' | wc -l)"
          echo "Lines: $(wc -l < <(cat bot.py db.py i18n.py dashboard.py cogs/*.py 2>/dev/null))"

  # ── 2. Docker Build & Push ────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            latest

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Koyeb ───────────────────────────────────
  deploy-koyeb:
    name: 🌍 Deploy to Koyeb
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Deploy to Koyeb
        uses: koyeb/action-deploy@v1
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}
          app_name: vortex-system-bot
          service_name: bot
          service_port: 8080
          docker_image: ghcr.io/${{ github.repository }}:latest

  # ── 4. Telegram Notification ──────────────────────────────
  notify:
    name: 📬 Notify
    runs-on: ubuntu-latest
    needs: [check, docker]
    if: always()
    steps:
      - name: 💬 Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ⬡ **VØRTΞX System Bot** — Deploy ${{ job.status == 'success' && '✅' || '❌' }}

            *Branch:* `${{ github.ref_name }}`
            *Commit:* [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            *Status:* ${{ job.status }}
            *Check:* ✅ `${{ needs.check.result }}`
            *Docker:* 🐳 `${{ needs.docker.result }}`
