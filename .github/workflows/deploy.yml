name: 🚀 VØRTΞX Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  check:
    name: 🔍 Syntax & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyflakes
      - name: Check bot code
        continue-on-error: false
        run: |
          echo "📋 Checking bot.py + cogs..."
          python3 -m pyflakes bot.py db.py dashboard.py cogs/*.py
      - name: Check hosting panel
        continue-on-error: false
        run: |
          echo "📋 Checking hosting panel..."
          python3 -m pyflakes hosting-panel/main.py

  docker:
    name: 🐳 Docker Build & Push
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker
        run: docker build -t $DOCKER_REGISTRY/nanocode-nanocode/vortex-system-bot:latest -t $DOCKER_REGISTRY/nanocode-nanocode/vortex-system-bot:${{ github.sha }} .
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $DOCKER_REGISTRY -u ${{ github.actor }} --password-stdin
          docker push --all-tags $DOCKER_REGISTRY/nanocode-nanocode/vortex-system-bot

  deploy-koyeb:
    name: 🚀 Deploy to Koyeb
    needs: docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy
        uses: koyeb/action-deploy@v1
        continue-on-error: true
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}
          app_name: vortex-system-bot
          service_name: bot-service

  deploy-panel:
    name: 🖥️ Deploy Hosting Panel to Koyeb
    needs: docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Panel
        uses: koyeb/action-deploy@v1
        continue-on-error: true
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}
          app_name: vortex-hosting-panel
          service_name: panel-service
          dockerfile: hosting-panel/Dockerfile
