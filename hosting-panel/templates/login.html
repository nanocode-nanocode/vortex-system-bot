<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VØRTΞX - Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cairo',sans-serif;
  background:#0a0b0e;
  color:#e8eaed;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 30%,rgba(88,101,242,0.12) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 70%,rgba(124,58,237,0.08) 0%,transparent 50%);
  pointer-events:none;
}
.login-card{
  position:relative;
  width:400px;max-width:90vw;
  padding:40px 32px;
  background:rgba(24,27,32,0.85);
  backdrop-filter:blur(24px);
  border:1px solid #282c34;
  border-radius:24px;
  text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,0.5);
}
.logo-icon{
  width:56px;height:56px;margin:0 auto 16px;
  background:linear-gradient(135deg,#5865F2,#7c3aed);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#fff;
  box-shadow:0 8px 32px rgba(88,101,242,0.3);
}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#8b8f96;font-size:14px;margin-bottom:24px}
.error{
  background:rgba(237,66,69,0.1);border:1px solid rgba(237,66,69,0.2);
  color:#ED4245;padding:10px 14px;border-radius:10px;
  margin-bottom:16px;font-size:13px;font-weight:600;
}
.input-group{text-align:right;margin-bottom:16px}
.input-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#b0b3b8}
.input-group input{
  width:100%;padding:12px 16px;
  background:#1e2126;border:1px solid #282c34;border-radius:10px;
  color:#e8eaed;font-family:'Cairo',sans-serif;font-size:15px;
  outline:none;transition:border-color .2s;
}
.input-group input:focus{border-color:#5865F2}
.btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,#5865F2,#7c3aed);
  color:#fff;border:none;border-radius:10px;
  font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(88,101,242,0.3);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,101,242,0.4)}
.btn:disabled{opacity:0.5;transform:none}
.badge{
  display:inline-block;padding:4px 12px;
  background:rgba(87,242,135,0.1);border:1px solid rgba(87,242,135,0.2);
  border-radius:100px;font-size:12px;color:#57F287;margin-bottom:16px;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="badge">🔒 آمــن</div>
  <div class="logo-icon">✦</div>
  <h1>{{ 'إنشاء حساب المشرف' if setup else 'دخول المشرف' }}</h1>
  <p class="sub">{{ 'لأول مرة — أنشئ كلمة مرور قوية' if setup else 'VØRTΞX Bot Hosting' }}</p>
  
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  
  <form method="POST" onsubmit="document.getElementById('btn').disabled=true;this.submit()">
    <div class="input-group">
      <label>🔑 كلمة المرور</label>
      <input type="password" name="password" required 
             minlength="6" autofocus
             placeholder="كلمة مرور قوية...">
    </div>
    <button type="submit" id="btn" class="btn">
      {{ '🔐 إنشاء الحساب' if setup else '🔓 دخول' }}
    </button>
  </form>
</div>
</body>
</html>
